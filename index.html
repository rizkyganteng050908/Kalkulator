<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kalkulator Modern Interaktif</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Font Awesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Plus Jakarta Sans', 'sans-serif'],
                    },
                    colors: {
                        dark: {
                            bg: '#0f172a',
                            card: '#1e293b',
                            btn: '#334155',
                            btnHover: '#475569',
                            accent: '#6366f1',
                            accentHover: '#4f46e5'
                        }
                    }
                }
            }
        }
    </script>
    
    <style>
        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            background: linear-gradient(135deg, #0f172a 0%, #1e1b4b 100%);
        }
        
        /* Custom scrollbar for history panel */
        .custom-scrollbar::-webkit-scrollbar {
            width: 6px;
        }
        .custom-scrollbar::-webkit-scrollbar-track {
            background: rgba(255, 255, 255, 0.05);
            border-radius: 8px;
        }
        .custom-scrollbar::-webkit-scrollbar-thumb {
            background: rgba(255, 255, 255, 0.2);
            border-radius: 8px;
        }
        .custom-scrollbar::-webkit-scrollbar-thumb:hover {
            background: rgba(255, 255, 255, 0.4);
        }

        /* Button click effect */
        .btn-active:active {
            transform: scale(0.95);
        }

        /* Glassmorphism Effect */
        .glass-panel {
            background: rgba(30, 41, 59, 0.7);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.08);
        }
    </style>
</head>
<body class="min-h-screen flex items-center justify-center p-4 sm:p-6 text-slate-100">

    <div class="w-full max-w-4xl grid grid-cols-1 lg:grid-cols-3 gap-6 items-start">
        
        <!-- CALCULATOR MAIN CARD -->
        <div class="lg:col-span-2 glass-panel rounded-3xl p-6 shadow-2xl transition-all duration-300">
            <!-- Header -->
            <div class="flex items-center justify-between mb-6">
                <div class="flex items-center space-x-2">
                    <div class="w-3 h-3 rounded-full bg-red-500"></div>
                    <div class="w-3 h-3 rounded-full bg-yellow-500"></div>
                    <div class="w-3 h-3 rounded-full bg-green-500"></div>
                    <span class="ml-2 text-xs font-semibold tracking-wider text-slate-400 uppercase">Kalkulator Pro</span>
                </div>
                <button id="toggleHistoryBtn" class="lg:hidden text-slate-400 hover:text-white p-2 rounded-lg hover:bg-slate-700/50 transition">
                    <i class="fa-solid fa-clock-rotate-left text-lg"></i>
                </button>
            </div>

            <div class="bg-slate-900/80 rounded-2xl p-5 mb-6 text-right shadow-inner border border-slate-800/80 min-h-[120px] flex flex-col justify-end space-y-1 overflow-hidden">
                <div id="previousOperand" class="text-slate-400 text-sm sm:text-base font-medium h-6 overflow-x-auto whitespace-nowrap custom-scrollbar"></div>
                <div id="currentOperand" class="text-3xl sm:text-4xl lg:text-5xl font-bold tracking-tight text-white overflow-x-auto whitespace-nowrap custom-scrollbar">0</div>
            </div>

            <div class="grid grid-cols-4 gap-3">
                <!-- Row 1 -->
                <button onclick="clearAll()" class="btn-active bg-red-500/20 text-red-400 hover:bg-red-500/30 font-semibold p-4 rounded-2xl text-lg sm:text-xl transition border border-red-500/30">C</button>
                <button onclick="deleteDigit()" class="btn-active bg-slate-700/50 text-slate-300 hover:bg-slate-700 font-semibold p-4 rounded-2xl text-lg sm:text-xl transition"><i class="fa-solid fa-backspace"></i></button>
                <button onclick="appendOperator('%')" class="btn-active bg-slate-700/50 text-indigo-400 hover:bg-slate-700 font-semibold p-4 rounded-2xl text-lg sm:text-xl transition">%</button>
                <button onclick="appendOperator('÷')" class="btn-active bg-indigo-600/80 hover:bg-indigo-600 text-white font-bold p-4 rounded-2xl text-xl transition shadow-lg shadow-indigo-600/20">÷</button>

                <!-- Row 2 -->
                <button onclick="appendNumber('7')" class="btn-active bg-slate-800/80 hover:bg-slate-700 text-white font-semibold p-4 rounded-2xl text-lg sm:text-xl transition border border-slate-700/40">7</button>
                <button onclick="appendNumber('8')" class="btn-active bg-slate-800/80 hover:bg-slate-700 text-white font-semibold p-4 rounded-2xl text-lg sm:text-xl transition border border-slate-700/40">8</button>
                <button onclick="appendNumber('9')" class="btn-active bg-slate-800/80 hover:bg-slate-700 text-white font-semibold p-4 rounded-2xl text-lg sm:text-xl transition border border-slate-700/40">9</button>
                <button onclick="appendOperator('×')" class="btn-active bg-indigo-600/80 hover:bg-indigo-600 text-white font-bold p-4 rounded-2xl text-xl transition shadow-lg shadow-indigo-600/20">×</button>

                <!-- Row 3 -->
                <button onclick="appendNumber('4')" class="btn-active bg-slate-800/80 hover:bg-slate-700 text-white font-semibold p-4 rounded-2xl text-lg sm:text-xl transition border border-slate-700/40">4</button>
                <button onclick="appendNumber('5')" class="btn-active bg-slate-800/80 hover:bg-slate-700 text-white font-semibold p-4 rounded-2xl text-lg sm:text-xl transition border border-slate-700/40">5</button>
                <button onclick="appendNumber('6')" class="btn-active bg-slate-800/80 hover:bg-slate-700 text-white font-semibold p-4 rounded-2xl text-lg sm:text-xl transition border border-slate-700/40">6</button>
                <button onclick="appendOperator('-')" class="btn-active bg-indigo-600/80 hover:bg-indigo-600 text-white font-bold p-4 rounded-2xl text-xl transition shadow-lg shadow-indigo-600/20">−</button>

                <!-- Row 4 -->
                <button onclick="appendNumber('1')" class="btn-active bg-slate-800/80 hover:bg-slate-700 text-white font-semibold p-4 rounded-2xl text-lg sm:text-xl transition border border-slate-700/40">1</button>
                <button onclick="appendNumber('2')" class="btn-active bg-slate-800/80 hover:bg-slate-700 text-white font-semibold p-4 rounded-2xl text-lg sm:text-xl transition border border-slate-700/40">2</button>
                <button onclick="appendNumber('3')" class="btn-active bg-slate-800/80 hover:bg-slate-700 text-white font-semibold p-4 rounded-2xl text-lg sm:text-xl transition border border-slate-700/40">3</button>
                <button onclick="appendOperator('+')" class="btn-active bg-indigo-600/80 hover:bg-indigo-600 text-white font-bold p-4 rounded-2xl text-xl transition shadow-lg shadow-indigo-600/20">+</button>

                <!-- Row 5 -->
                <button onclick="toggleSign()" class="btn-active bg-slate-800/80 hover:bg-slate-700 text-white font-semibold p-4 rounded-2xl text-lg sm:text-xl transition border border-slate-700/40">+/−</button>
                <button onclick="appendNumber('0')" class="btn-active bg-slate-800/80 hover:bg-slate-700 text-white font-semibold p-4 rounded-2xl text-lg sm:text-xl transition border border-slate-700/40">0</button>
                <button onclick="appendNumber('.')" class="btn-active bg-slate-800/80 hover:bg-slate-700 text-white font-semibold p-4 rounded-2xl text-lg sm:text-xl transition border border-slate-700/40">.</button>
                <button onclick="calculate()" class="btn-active bg-emerald-500 hover:bg-emerald-600 text-white font-bold p-4 rounded-2xl text-xl transition shadow-lg shadow-emerald-500/20">=</button>
            </div>
        </div>

        <div id="historyContainer" class="hidden lg:block glass-panel rounded-3xl p-6 shadow-2xl h-full flex flex-col justify-between">
            <div>
                <div class="flex items-center justify-between pb-4 mb-4 border-b border-slate-700/60">
                    <h3 class="font-bold text-slate-200 flex items-center gap-2">
                        <i class="fa-solid fa-clock-rotate-left text-indigo-400"></i> Riwayat
                    </h3>
                    <button onclick="clearHistory()" class="text-xs text-slate-400 hover:text-red-400 transition flex items-center gap-1">
                        <i class="fa-solid fa-trash-can"></i> Hapus
                    </button>
                </div>

                <!-- History Item List -->
                <div id="historyList" class="space-y-3 max-h-[360px] overflow-y-auto pr-1 custom-scrollbar">
                    <div class="text-center text-slate-500 py-8 text-sm italic" id="emptyHistoryMsg">
                        Belum ada riwayat perhitungan.
                    </div>
                </div>
            </div>

            <div class="mt-4 pt-4 border-t border-slate-700/40 text-xs text-slate-400 text-center">
                Tekan angka / operator di keyboard
            </div>
        </div>

    </div>

    <script>
        // State variables
        let currentInput = '0';
        let previousInput = '';
        let operator = null;
        let shouldResetScreen = false;
        let history = [];

        // DOM Elements
        const currentOperandElement = document.getElementById('currentOperand');
        const previousOperandElement = document.getElementById('previousOperand');
        const historyListElement = document.getElementById('historyList');
        const emptyHistoryMsg = document.getElementById('emptyHistoryMsg');
        const toggleHistoryBtn = document.getElementById('toggleHistoryBtn');
        const historyContainer = document.getElementById('historyContainer');

        // Toggle history mobile view
        toggleHistoryBtn.addEventListener('click', () => {
            historyContainer.classList.toggle('hidden');
        });

        function updateDisplay() {
            currentOperandElement.innerText = formatNumber(currentInput);
            if (operator !== null) {
                previousOperandElement.innerText = `${formatNumber(previousInput)} ${operator}`;
            } else {
                previousOperandElement.innerText = previousInput;
            }
        }

        function formatNumber(number) {
            if (number === '' || number === undefined) return '';
            if (number === 'Error' || number === 'Tidak bisa dibagi 0') return number;
            
            const stringNumber = number.toString();
            const [integerDigits, decimalDigits] = stringNumber.split('.');
            
            let integerDisplay = '';
            if (integerDigits === '-') {
                integerDisplay = '-';
            } else if (!isNaN(parseFloat(integerDigits))) {
                integerDisplay = parseFloat(integerDigits).toLocaleString('id-ID', { maximumFractionDigits: 0 });
            } else {
                integerDisplay = '';
            }

            if (decimalDigits != null) {
                return `${integerDisplay},${decimalDigits}`;
            } else {
                return integerDisplay;
            }
        }

        function appendNumber(number) {
            if (currentInput === '0' || shouldResetScreen) {
                resetScreen();
            }
            if (number === '.' && currentInput.includes('.')) return;
            currentInput += number;
            updateDisplay();
        }

        function resetScreen() {
            currentInput = '';
            shouldResetScreen = false;
        }

        function clearAll() {
            currentInput = '0';
            previousInput = '';
            operator = null;
            updateDisplay();
        }

        function deleteDigit() {
            if (shouldResetScreen) return;
            if (currentInput.length === 1 || currentInput === 'Error' || currentInput === 'Tidak bisa dibagi 0') {
                currentInput = '0';
            } else {
                currentInput = currentInput.slice(0, -1);
            }
            updateDisplay();
        }

        function toggleSign() {
            if (currentInput === '0' || currentInput === 'Error') return;
            currentInput = (parseFloat(currentInput) * -1).toString();
            updateDisplay();
        }

        function appendOperator(op) {
            if (currentInput === 'Error' || currentInput === 'Tidak bisa dibagi 0') return;
            if (operator !== null && !shouldResetScreen) {
                calculate();
            }
            operator = op;
            previousInput = currentInput;
            shouldResetScreen = true;
            updateDisplay();
        }

        function calculate() {
            if (operator === null || shouldResetScreen) return;

            let prev = parseFloat(previousInput);
            let current = parseFloat(currentInput);

            if (isNaN(prev) || isNaN(current)) return;

            let result = 0;
            const expression = `${formatNumber(previousInput)} ${operator} ${formatNumber(currentInput)}`;

            switch (operator) {
                case '+':
                    result = prev + current;
                    break;
                case '-':
                    result = prev - current;
                    break;
                case '×':
                    result = prev * current;
                    break;
                case '÷':
                    if (current === 0) {
                        currentInput = 'Tidak bisa dibagi 0';
                        operator = null;
                        previousInput = '';
                        shouldResetScreen = true;
                        updateDisplay();
                        return;
                    }
                    result = prev / current;
                    break;
                case '%':
                    result = (prev * current) / 100;
                    break;
                default:
                    return;
            }

            // Fix floating point issues
            result = Math.round(result * 100000000) / 100000000;
            
            const resultStr = result.toString();
            addHistory(expression, formatNumber(resultStr), resultStr);

            currentInput = resultStr;
            operator = null;
            previousInput = '';
            shouldResetScreen = true;
            updateDisplay();
        }

        function addHistory(expression, formattedResult, rawResult) {
            history.unshift({ expression, formattedResult, rawResult });
            renderHistory();
        }

        function renderHistory() {
            if (history.length === 0) {
                emptyHistoryMsg.style.display = 'block';
                historyListElement.innerHTML = '';
                historyListElement.appendChild(emptyHistoryMsg);
                return;
            }

            emptyHistoryMsg.style.display = 'none';
            historyListElement.innerHTML = '';

            history.forEach((item) => {
                const historyCard = document.createElement('div');
                historyCard.className = 'bg-slate-800/50 hover:bg-slate-700/60 p-3 rounded-xl cursor-pointer transition border border-slate-700/30 flex flex-col text-right';
                historyCard.innerHTML = `
                    <span class="text-xs text-slate-400">${item.expression} =</span>
                    <span class="text-lg font-bold text-indigo-300">${item.formattedResult}</span>
                `;
                historyCard.onclick = () => {
                    currentInput = item.rawResult;
                    shouldResetScreen = false;
                    updateDisplay();
                };
                historyListElement.appendChild(historyCard);
            });
        }

        function clearHistory() {
            history = [];
            renderHistory();
        }

        window.addEventListener('keydown', (e) => {
            if (e.key >= '0' && e.key <= '9') appendNumber(e.key);
            if (e.key === '.') appendNumber('.');
            if (e.key === '=' || e.key === 'Enter') {
                e.preventDefault();
                calculate();
            }
            if (e.key === 'Backspace') deleteDigit();
            if (e.key === 'Escape') clearAll();
            if (e.key === '+') appendOperator('+');
            if (e.key === '-') appendOperator('-');
            if (e.key === '*') appendOperator('×');
            if (e.key === '/') {
                e.preventDefault();
                appendOperator('÷');
            }
            if (e.key === '%') appendOperator('%');
        });
    </script>
</body>
</html>
